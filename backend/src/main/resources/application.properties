server.port=${PORT:8080}
spring.application.name=portfolio-api

# Comma-separated list of frontend origins allowed to call the API.
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Where received messages are appended (JSON lines).
portfolio.contact.storage-file=${CONTACT_STORAGE_FILE:data/messages.jsonl}

# Rate limit per client IP.
portfolio.contact.rate-limit.max-requests=5
portfolio.contact.rate-limit.window-minutes=10

# Optional email forwarding. Only attempted when PORTFOLIO_MAIL_TO and SMTP_HOST are both set.
portfolio.mail.to=${PORTFOLIO_MAIL_TO:}
portfolio.mail.from=${PORTFOLIO_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
